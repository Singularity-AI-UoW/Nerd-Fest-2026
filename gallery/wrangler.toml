[vars]
VOTE_CLOSE_AT = "2026-10-30T18:30:00+13:00"

# Secret (set with `wrangler secret put UPLOAD_TOKEN`, never committed): UPLOAD_TOKEN

[[d1_databases]]
binding = "DB"
