preset_ideas = [
    "a kiwi bird surfing a giant wave",
    "a friendly dragon baking cupcakes",
    "a robot playing cricket on the beach",
    "a sheep riding a skateboard through a forest",
    "a penguin astronaut planting a flag on the moon",
    "a tui singing on top of a rainbow",
    "an octopus juggling colourful balloons",
    "a fantail dancing in a field of flowers",
    "a happy dinosaur having a picnic",
    "a pirate ship sailing through the clouds",
]
preset_tweaks = [
    "spooky Halloween, still fun for kids",
    "make it cartoon style",
    "add a party hat",
    "make it snow",
]

[models]
llm = "openai/gpt-6.1-sol"
fallback_llm = "Qwen3.8-27B"
stt = "gemini-3.5-transcribe-live"
image = "gemini-3.1-flash-lite-image"
image_size = "1K"

[button]
key = "f9"
hold_threshold_s = 0.4
tap_window_s = 0.4

[timeouts]
# choose_mode_s, confirm_s, tweak_s and takehome_s wait for the visitor's button or
# the organiser page; these are only safety nets for when nobody does anything.
choose_mode_s = 180
listen_wait_s = 20
listen_hold_max_s = 15
confirm_s = 180
agent_cap_s = 45  # the agent's own work; the clock stops during the tweak wait
tweak_s = 180
takehome_s = 180
image_call_s = 30
llm_call_s = 15

[limits]
max_tool_calls = 10
max_blocked_tries = 2
max_request_chars = 200
max_stt_retries = 1

[voting]
close_at = "2026-10-30T18:00:00+13:00"
claim_until = "2026-10-30T18:30:00+13:00"

[files]
blocklist = "kiosk/blocklist.txt"
signup_qr = "sign_up_qr.svg"
data_dir = "kiosk_data"

[display]
tv_window_x = 1920
port = 8765
