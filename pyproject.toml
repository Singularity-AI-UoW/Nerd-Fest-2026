[project]
name = "nerdfest-kiosk"
version = "0.1.0"
description = "Self-running AI image stall kiosk for Nerd Fest 2026"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "playwright",
    "google-genai",
    "openai",
    "httpx",
    "pynput",
    "sounddevice",
    "numpy",
    "pillow",
    "segno",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["browser: drives a real headless Chromium (skipped if Chromium is not installed)"]
